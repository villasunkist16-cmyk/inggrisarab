<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Cerdas Cermat Bersama Apih Bobby</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- OPENING SCREEN -->
<div id="startScreen" class="start-screen">

    <img src="opening.jpg"
         class="opening-image"
         alt="Opening">

    <button id="startBtn" class="play-btn">
        <img src="play.png" alt="Play">
    </button>

</div>

<!-- GAME SCREEN -->
<div id="gameScreen" style="display:none;">

    <div class="container">

        <!-- Header -->
        <div class="top-bar">

            <div id="question-number">
                1/20
            </div>

            <div class="score-box">
                <img src="score-bar.png">
                <span id="score">0</span>
            </div>

        </div>

        <!-- Soal -->
        <div class="question-box">

            <img
                id="questionImage"
                class="question-image"
                src=""
                alt="Soal"
                style="display:none;">

            <div id="question">
                Memuat soal...
            </div>

        </div>

        <!-- Pilihan -->
        <div id="options" class="options"></div>

        <!-- Tombol -->
        <div class="footer">

            <button id="actionBtn">
                <img
                    id="actionBtnImg"
                    src="ulangi-soal.png"
                    alt="Action Button">
            </button>

        </div>

    </div>

</div>

<!-- AUDIO -->
<audio id="openingMusic" src="opening.mp3" loop></audio>

<audio id="bgMusic" src="bgm.mp3" loop></audio>


<script src="app.js"></script>

</body>
</html>
