<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Cerdas Cermat Bersama Apih Bobby</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===================== -->
    <!-- OPENING SCREEN -->
    <!-- ===================== -->

    <!-- OPENING SCREEN -->
<div id="startScreen" class="start-screen">

    <img
        src="opening.jpg"
        class="opening-image"
        alt="Opening">

    <button id="startBtn" class="play-btn">

        <img
            src="play.png"
            alt="Play">

    </button>


</div>

    <!-- ===================== -->
    <!-- GAME SCREEN -->
    <!-- ===================== -->

    <div id="gameScreen" style="display:none;">

        <div class="container">

            <!-- Nomor Soal -->

            <div id="question-number">
                Soal 1 dari 20
            </div>

            <!-- Pertanyaan -->

            <div class="question-box">

    <img
        id="questionImage"
        class="question-image"
        src=""
        alt="Soal"
        style="display:none;">

    <div id="question">
        Memuat soal...
    </div>

</div>

            <!-- Pilihan Jawaban -->

            <div id="options" class="options"></div>

            <!-- Footer -->

            <div class="footer">

    <!-- Tombol Ulangi / Next -->
    <button id="actionBtn">
        <img
            id="actionBtnImg"
            src="ulangi-soal.png"
            alt="Action Button">
    </button>

    <!-- Score -->
    <div class="score-box">

        <img
            class="score-bg"
            src="score-bar.png"
            alt="Score">

        <span id="score">0</span>

    </div>

</div>

        </div>

    </div>

    <!-- ===================== -->
    <!-- AUDIO -->
    <!-- ===================== -->

    <!-- Musik Opening -->

    <audio
        id="openingMusic"
        src="opening.mp3"
        loop>
    </audio>

    <!-- Musik Game -->

    <audio
        id="bgMusic"
        src="bgm.mp3"
        loop>
    </audio>

    <!-- ===================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================== -->

    <script src="app.js"></script>

</body>
</html>
